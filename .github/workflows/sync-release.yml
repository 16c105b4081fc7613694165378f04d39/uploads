name: Sync Release Assets to Destination

on:
  release:
    types: [published, edited]
  workflow_dispatch:   # 🔴 ye naya line hai, manual trigger ke liye
    inputs:
      tag:
        description: 'Release tag to sync'
        required: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync assets
        env:
          GH_TOKEN: ${{ secrets.DEST_REPO_PAT }}
          DEST_REPO: 16c105b4081fc7613694165378f04d39/backup   # 🔴 apna destination repo likhein
        run: |
          # Agar manual run hai to input tag use karein, warna automatic release tag
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          SOURCE="${{ github.repository }}"
          
          echo "🔄 Syncing '$TAG' from $SOURCE to $DEST_REPO..."
          
          mkdir -p assets
          gh release download "$TAG" --repo "$SOURCE" --dir assets
          
          if gh release view "$TAG" --repo "$DEST_REPO" &>/dev/null; then
            echo "✅ Release '$TAG' already exists in destination."
          else
            echo "📦 Creating release '$TAG' in destination..."
            NOTES=$(gh release view "$TAG" --repo "$SOURCE" --json body -q '.body')
            gh release create "$TAG" --repo "$DEST_REPO" --title "Release $TAG" --notes "$NOTES"
          fi
          
          if [ -n "$(ls -A assets/ 2>/dev/null)" ]; then
            for file in assets/*; do
              echo "⬆️ Uploading $(basename "$file")..."
              gh release upload "$TAG" "$file" --repo "$DEST_REPO" --clobber
            done
          else
            echo "ℹ️ No assets found in this release."
          fi
          
          echo "🎉 Sync complete!"
