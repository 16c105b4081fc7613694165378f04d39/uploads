name: Sync Release Assets to Destination

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync'
        required: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Incremental sync assets
        env:
          GH_TOKEN: ${{ secrets.DEST_REPO_PAT }}
          DEST_REPO: 16c105b4081fc7613694165378f04d39/backup   # 🔴 APNA DESTINATION REPO LIKHEIN
        run: |
          # Tag determine karein
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          SOURCE="${{ github.repository }}"
          
          echo "🔄 Incremental sync: '$TAG' from $SOURCE to $DEST_REPO..."
          
          # 1. Destination ki existing assets ki list lo
          echo "📋 Fetching existing assets in destination..."
          if gh release view "$TAG" --repo "$DEST_REPO" &>/dev/null; then
            gh release view "$TAG" --repo "$DEST_REPO" --json assets -q '.assets[].name' > /tmp/existing_assets.txt
            echo "✅ Found $(wc -l < /tmp/existing_assets.txt) existing assets"
          else
            echo "📦 Creating new release in destination..."
            NOTES=$(gh release view "$TAG" --repo "$SOURCE" --json body -q '.body')
            gh release create "$TAG" --repo "$DEST_REPO" --title "Release $TAG" --notes "$NOTES"
            touch /tmp/existing_assets.txt  # empty file
          fi
          
          # 2. Source se saare assets download karo (temporary)
          echo "⬇️ Downloading source assets..."
          mkdir -p assets
          gh release download "$TAG" --repo "$SOURCE" --dir assets
          
          # 3. Sirf naye aur changed files upload karo
          echo "🔍 Checking for new/updated files..."
          UPLOADED=0
          SKIPPED=0
          
          for file in assets/*; do
            fname=$(basename "$file")
            if grep -Fxq "$fname" /tmp/existing_assets.txt; then
              echo "⏭️ Skipping (already exists): $fname"
              SKIPPED=$((SKIPPED + 1))
            else
              echo "⬆️ Uploading new file: $fname"
              gh release upload "$TAG" "$file" --repo "$DEST_REPO" --clobber
              UPLOADED=$((UPLOADED + 1))
            fi
          done
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 Sync Summary:"
          echo "   ✅ Uploaded: $UPLOADED new file(s)"
          echo "   ⏭️ Skipped: $SKIPPED existing file(s)"
          echo "   💡 Tip: Renamed files appear as new. Old files stay until manually deleted."
          echo "🎉 Incremental sync complete!"
