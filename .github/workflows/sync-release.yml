name: Sync Release Assets to Destination

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync'
        required: false
  schedule:
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 * * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Auto sync v1.0.0
        env:
          GH_TOKEN: ${{ secrets.DEST_REPO_PAT }}
          DEST_REPO: 16c105b4081fc7613694165378f04d39/backup
          SOURCE_REPO: ${{ github.repository }}
          FIXED_TAG: "v1.0.0"
        run: |
          # Tag determine karein
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="$FIXED_TAG"
            echo "📅 Auto scheduled sync: $TAG"
          fi
          
          echo "🔄 Syncing '$TAG' from $SOURCE_REPO to $DEST_REPO"
          
          # Destination release check
          if ! gh release view "$TAG" --repo "$DEST_REPO" &>/dev/null; then
            echo "📦 Creating destination release..."
            NOTES=$(gh release view "$TAG" --repo "$SOURCE_REPO" --json body -q '.body' 2>/dev/null || echo "")
            gh release create "$TAG" --repo "$DEST_REPO" --title "Release $TAG" --notes "$NOTES"
          fi
          
          # Get existing assets from destination
          gh release view "$TAG" --repo "$DEST_REPO" --json assets -q '.assets[].name' 2>/dev/null | sort > /tmp/existing.txt
          
          # Get source assets
          gh release view "$TAG" --repo "$SOURCE_REPO" --json assets -q '.assets[].name' 2>/dev/null | sort > /tmp/source.txt
          
          # Find new files
          comm -23 /tmp/source.txt /tmp/existing.txt > /tmp/new_files.txt
          NEW_COUNT=$(wc -l < /tmp/new_files.txt | tr -d ' ')
          
          echo "📊 Existing: $(wc -l < /tmp/existing.txt | tr -d ' ') | New: $NEW_COUNT"
          
          if [ "$NEW_COUNT" -eq 0 ]; then
            echo "✅ Already up-to-date!"
            exit 0
          fi
          
          # Download only new files
          mkdir -p assets_new
          while IFS= read -r fname; do
            [ -z "$fname" ] && continue
            echo "⬇️ Downloading: $fname"
            gh release download "$TAG" --repo "$SOURCE_REPO" --pattern "$fname" --dir assets_new --clobber 2>/dev/null || echo "⚠️ Failed: $fname"
          done < /tmp/new_files.txt
          
          # Upload new files
          for file in assets_new/*; do
            [ -f "$file" ] || continue
            fname=$(basename "$file")
            echo "⬆️ Uploading: $fname"
            gh release upload "$TAG" "$file" --repo "$DEST_REPO" --clobber 2>/dev/null || echo "⚠️ Upload failed: $fname"
          done
          
          echo "🎉 Sync complete! ($NEW_COUNT files uploaded)"
