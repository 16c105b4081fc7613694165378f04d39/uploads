name: Sync Release Assets to Destination

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync (optional)'
        required: false
  schedule:
    - cron: '*/05 * * * *'   # Har 30 minute mein auto-check

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Smart incremental sync
        env:
          GH_TOKEN: ${{ secrets.DEST_REPO_PAT }}
          DEST_REPO: 16c105b4081fc7613694165378f04d39/backup
          SOURCE_REPO: ${{ github.repository }}
        run: |
          # Tag determine karein
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG=$(gh release list --repo "$SOURCE_REPO" --limit 1 --json tagName -q '.[0].tagName')
            if [ -z "$TAG" ]; then
              echo "❌ No releases found."
              exit 0
            fi
            echo "📅 Scheduled sync: latest tag '$TAG'"
          fi
          
          echo "🔄 Sync '$TAG' from $SOURCE_REPO to $DEST_REPO"
          
          # Destination check
          if ! gh release view "$TAG" --repo "$DEST_REPO" &>/dev/null; then
            NOTES=$(gh release view "$TAG" --repo "$SOURCE_REPO" --json body -q '.body')
            gh release create "$TAG" --repo "$DEST_REPO" --title "Release $TAG" --notes "$NOTES"
            echo "📦 Created release in destination"
          fi
          
          # Existing assets in destination
          gh release view "$TAG" --repo "$DEST_REPO" --json assets -q '.assets[].name' > /tmp/existing.txt
          
          # Source assets
          gh release view "$TAG" --repo "$SOURCE_REPO" --json assets -q '.assets[].name' > /tmp/source.txt
          
          # New files
          comm -23 <(sort /tmp/source.txt) <(sort /tmp/existing.txt) > /tmp/new_files.txt
          NEW_COUNT=$(wc -l < /tmp/new_files.txt)
          
          echo "✨ New files to upload: $NEW_COUNT"
          
          if [ "$NEW_COUNT" -eq 0 ]; then
            echo "✅ Already up-to-date!"
            exit 0
          fi
          
          # Download only new
          mkdir -p assets_new
          while IFS= read -r fname; do
            [ -z "$fname" ] && continue
            echo "⬇️ $fname"
            gh release download "$TAG" --repo "$SOURCE_REPO" --pattern "$fname" --dir assets_new --clobber
          done < /tmp/new_files.txt
          
          # Upload new
          for file in assets_new/*; do
            [ -f "$file" ] || continue
            echo "⬆️ $(basename "$file")"
            gh release upload "$TAG" "$file" --repo "$DEST_REPO" --clobber
          done
          
          echo "🎉 Sync complete!"
